<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="余烬远征：一款主线驱动的纯文字放置冒险游戏。">
  <title>余烬远征 / Idle Expedition</title>
  <script>
    /* 错误日志引导：在样式与主模块之前安装，只向控制台输出错误（F12 -> Console，过滤 [WebIdle]）。 */
    (function () {
      function log(message, detail) {
        console.error('[WebIdle] ' + message + (detail === undefined || detail === null || detail === '' ? '' : ' :: ' + detail));
      }
      window.addEventListener('error', function (event) {
        var target = event.target;
        if (target && target !== window && target.tagName) {
          log('[resource] ' + target.tagName + ' 加载失败', target.src || target.href || '');
        } else {
          log('[error] ' + (event.message || '未知脚本错误'), (event.filename || '') + ':' + (event.lineno || 0) + ':' + (event.colno || 0));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        log('[promise] 未处理的 Promise 异常', (reason && (reason.stack || reason.message)) || String(reason));
      });
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (window.__idleBooted) return;
          log('[boot] 主模块未执行（1.5 秒内未收到启动信号）。常见原因：用 http 服务打开了项目根目录的 index.html，浏览器无法直接运行 ./src/main.ts；请改用 dist/ 产物（npm run build 后 python server.py）或运行 npm run dev。');
        }, 1500);
      });
    })();
  </script>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="app-shell" id="game-app">
    <header class="game-header">
      <div class="brand-group">
        <div>
          <p class="eyebrow">TEXT IDLE RPG / CHAPTER 01</p>
          <h1>余烬远征</h1>
          <p class="subtitle">在世界熄灭之前，让远征队穿过荒原，重新点亮每一座营火。</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="wiki-open" id="wiki-open" type="button" aria-haspopup="dialog"><span aria-hidden="true">📖</span>WIKI</button>
        <div class="status" id="game-status"><i></i><span>原地待命</span></div>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar" aria-label="游戏导航">
        <div class="sidebar-heading">
          <span class="panel-kicker">NAVIGATION</span>
          <button class="nav-toggle" id="nav-toggle" type="button" aria-label="展开或收缩导航栏" aria-expanded="true">☰</button>
        </div>
        <nav class="main-nav" id="main-nav">
          <!-- 顺序：远征档案 / 冒险 / 庇护所 / 物品栏 / 工坊 / 研究基地 / 设置。
               开局落点是**冒险**（远征队先在荒野上原地待命），庇护所排在它下面 ——
               营火点起来之前它是锁着的，显示成「❓未解锁」。 -->
          <button class="nav-item" type="button" data-page="story"><span class="nav-index" aria-hidden="true">📜</span><span class="sidebar-label">远征档案</span></button>
          <button class="nav-item active" type="button" data-page="adventure"><span class="nav-index" aria-hidden="true">⚔️</span><span class="sidebar-label">冒险</span></button>
          <button class="nav-item" type="button" data-page="camp"><span class="nav-index" aria-hidden="true">⛺</span><span class="sidebar-label">庇护所</span></button>
          <button class="nav-item" type="button" data-page="inventory"><span class="nav-index" aria-hidden="true">🎒</span><span class="sidebar-label">物品栏</span><span class="nav-load"></span></button>
          <button class="nav-item" type="button" data-page="workshop"><span class="nav-index" aria-hidden="true">🔨</span><span class="sidebar-label">工坊</span></button>
          <button class="nav-item" type="button" data-page="research"><span class="nav-index" aria-hidden="true">🧪</span><span class="sidebar-label">研究基地</span></button>
          <!-- 「设置」固定在最后（CSS 里靠 order 兜底，见 style.css 的 .nav-item[data-page] 那条）：
               新系统的导航项一律插在它**之前**，不要追加到 </nav> 前。 -->
          <button class="nav-item" type="button" data-page="settings"><span class="nav-index" aria-hidden="true">🔧</span><span class="sidebar-label">设置</span></button>
        </nav>
        <div class="sidebar-foot sidebar-label">每一个系统，都会回头改变远征。</div>
      </aside>

      <main class="page-content" id="page-content" aria-live="polite"></main>

      <!-- 右侧常驻概览栏：资源 / 冒险状态 / 当前主线（主界面撤掉后就靠它）。
           切页面时不会重挂，所以骨架直接写在这里，src/hud.ts 只负责取 data-ref 并每帧写值。
           1300px 以下它变成整行横条、排到内容上方（见 style.css 的同名注释）。 -->
      <aside class="hud" id="hud" aria-label="远征概览">
        <button class="hud-toggle" id="hud-toggle" type="button" aria-label="展开或收起概览栏" aria-expanded="true">›</button>
        <section class="panel hud-block" id="hud-resources">
          <div class="panel-heading"><div><span class="panel-kicker">SUPPLIES</span><h3>资源</h3></div><button class="text-button" type="button" data-page="inventory">物品栏 →</button></div>
          <div class="hud-stats">
            <div class="mini-stat"><span>金币</span><b data-ref="gold"></b></div>
            <div class="mini-stat"><span>废料</span><b data-ref="scrap"></b></div>
            <div class="mini-stat"><span>精华</span><b data-ref="essence"></b></div>
            <div class="mini-stat" data-ref="logisticsCell"><span>后勤小队</span><b data-ref="logistics"></b></div>
          </div>
        </section>

        <section class="panel hud-block" id="hud-adventure">
          <div class="panel-heading"><div><span class="panel-kicker">EXPEDITION STATUS</span><h3>冒险</h3></div><button class="text-button" type="button" data-page="adventure" data-ref="cta"></button></div>
          <div class="hud-state" data-ref="state"><span class="status-dot" aria-hidden="true"></span><span data-ref="statusText"></span></div>
          <div class="hud-rows">
            <div class="hud-row"><span>目标区域</span><b data-ref="zone"></b></div>
            <div class="hud-row"><span>当前敌人</span><b data-ref="enemy"></b></div>
            <div class="hud-row" data-ref="hpRow"><span>生命值</span><b data-ref="hp"></b></div>
            <div class="hud-row" data-ref="expeditionRow" hidden><span>勘探队</span><b data-ref="expedition"></b></div>
          </div>
        </section>

        <section class="panel hud-block" id="hud-mainline">
          <div class="panel-heading"><div><span class="panel-kicker">MAINLINE</span><h3>当前主线</h3></div><button class="text-button" type="button" data-page="story">远征档案 →</button></div>
          <div data-ref="quest"></div>
        </section>
      </aside>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
