<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="余烬远征：一款主线驱动的纯文字放置冒险游戏。">
  <title>余烬远征 / Idle Expedition</title>
  <script>
    /* 错误日志引导：在样式与主模块之前安装，只向控制台输出错误（F12 -> Console，过滤 [WebIdle]）。 */
    (function () {
      function log(message, detail) {
        console.error('[WebIdle] ' + message + (detail === undefined || detail === null || detail === '' ? '' : ' :: ' + detail));
      }
      window.addEventListener('error', function (event) {
        var target = event.target;
        if (target && target !== window && target.tagName) {
          log('[resource] ' + target.tagName + ' 加载失败', target.src || target.href || '');
        } else {
          log('[error] ' + (event.message || '未知脚本错误'), (event.filename || '') + ':' + (event.lineno || 0) + ':' + (event.colno || 0));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        log('[promise] 未处理的 Promise 异常', (reason && (reason.stack || reason.message)) || String(reason));
      });
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (window.__idleBooted) return;
          log('[boot] 主模块未执行（1.5 秒内未收到启动信号）。常见原因：用 http 服务打开了项目根目录的 index.html，浏览器无法直接运行 ./src/main.ts；请改用 dist/ 产物（npm run build 后 python server.py）或运行 npm run dev。');
        }, 1500);
      });
    })();
  </script>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="app-shell" id="game-app">
    <header class="game-header">
      <div class="brand-group">
        <div>
          <p class="eyebrow">TEXT IDLE RPG / CHAPTER 01</p>
          <h1>余烬远征</h1>
          <p class="subtitle">在世界熄灭之前，让远征队穿过荒原，重新点亮每一座营火。</p>
        </div>
      </div>
      <div class="status" id="game-status"><i></i><span>营地待命</span></div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar" aria-label="游戏导航">
        <div class="sidebar-heading">
          <span class="panel-kicker">NAVIGATION</span>
          <button class="nav-toggle" id="nav-toggle" type="button" aria-label="展开或收缩导航栏" aria-expanded="true">☰</button>
        </div>
        <nav class="main-nav" id="main-nav">
          <button class="nav-item active" type="button" data-page="home"><span class="nav-index" aria-hidden="true">🏕️</span><span class="sidebar-label">主界面</span></button>
          <button class="nav-item" type="button" data-page="adventure"><span class="nav-index" aria-hidden="true">⚔️</span><span class="sidebar-label">冒险</span></button>
          <button class="nav-item" type="button" data-page="inventory"><span class="nav-index" aria-hidden="true">🎒</span><span class="sidebar-label">物品栏</span></button>
          <button class="nav-item" type="button" data-page="systems"><span class="nav-index" aria-hidden="true">⚙️</span><span class="sidebar-label">远征系统</span></button>
          <button class="nav-item" type="button" data-page="story"><span class="nav-index" aria-hidden="true">📜</span><span class="sidebar-label">剧情档案</span></button>
          <button class="nav-item" type="button" data-page="settings"><span class="nav-index" aria-hidden="true">🔧</span><span class="sidebar-label">设置</span></button>
        </nav>
        <div class="sidebar-foot sidebar-label">每一个系统，都会回头改变远征。</div>
      </aside>

      <main class="page-content" id="page-content" aria-live="polite"></main>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
